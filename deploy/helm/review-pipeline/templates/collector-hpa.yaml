{{- if .Values.collector.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "review-pipeline.fullname" . }}-collector
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "review-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "review-pipeline.fullname" . }}-collector
  minReplicas: {{ .Values.collector.hpa.minReplicas }}
  maxReplicas: {{ .Values.collector.hpa.maxReplicas }}
  behavior:
    {{- toYaml .Values.collector.hpa.behavior | nindent 4 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.collector.hpa.cpuTargetAverageUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.collector.hpa.memoryTargetAverageUtilization }}
    {{- if .Values.collector.hpa.customMetrics.enabled }}
    - type: Pods
      pods:
        metric:
          name: nats_queue_pending
        target:
          type: AverageValue
          averageValue: {{ .Values.collector.hpa.customMetrics.natsPendingTarget }}
    {{- end }}
{{- end }}
