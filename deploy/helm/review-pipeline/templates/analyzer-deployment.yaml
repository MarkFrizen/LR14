apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "review-pipeline.fullname" . }}-analyzer
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "review-pipeline.labels" . | nindent 4 }}
    {{- include "review-pipeline.analyzer.matchLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.analyzer.replicas }}
  selector:
    matchLabels:
      {{- include "review-pipeline.analyzer.matchLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "review-pipeline.analyzer.matchLabels" . | nindent 8 }}
    spec:
      containers:
        - name: analyzer
          image: {{ .Values.analyzer.image.repository }}:{{ .Values.analyzer.image.tag }}
          imagePullPolicy: {{ .Values.analyzer.image.pullPolicy }}
          args:
            - --nats={{ include "review-pipeline.nats.url" . }}
            - --flush-interval={{ .Values.analyzer.flushInterval }}
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.analyzer.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "review-pipeline.fullname" . }}-analyzer-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "review-pipeline.fullname" . }}-analyzer-data
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.analyzer.storageSize }}
