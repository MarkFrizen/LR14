apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: collector
  namespace: review-collector
  labels:
    app: collector
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: collector
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
  metrics:
    # ── Стандартные resource-метрики ──────────────────────────────────
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # ── Кастомная метрика: длина очереди NATS JetStream ──────────────
    - type: Pods
      pods:
        metric:
          name: nats_queue_pending
        target:
          type: AverageValue
          averageValue: 500
