apiVersion: v1
kind: Service
metadata:
  name: collector
  namespace: review-collector
  labels:
    app: collector
    component: review-collector
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app: collector
  ports:
    - name: http
      port: 8080
      targetPort: health
      protocol: TCP
